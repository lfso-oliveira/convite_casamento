<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Presenças</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f9f5ef;
      --card: #ffffff;
      --text: #1f1a16;
      --muted: #6b5c50;
      --accent: #8a6f4d;
      --green: #2f6b3a;
      --red: #a64545;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Montserrat", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.4rem;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
    }

    p { color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid #eadfd3;
      border-radius: 14px;
      padding: 1.2rem 1.1rem;
      box-shadow: 0 16px 32px rgba(0,0,0,0.06);
      max-width: 1100px;
      margin: 1.2rem auto;
    }

    .summary {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .pill {
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      background: #f0e6d9;
      font-size: 0.9rem;
      border: 1px solid #e6d7c7;
    }

    .pill.green { background: #e4f3e8; border-color: #c7e3cf; color: var(--green); }
    .pill.red { background: #f7e4e4; border-color: #e8c6c6; color: var(--red); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.6rem;
      font-size: 0.95rem;
    }

    th, td {
      padding: 0.65rem 0.5rem;
      border-bottom: 1px solid #eee4d7;
      text-align: left;
    }

    th { font-weight: 600; color: var(--muted); }

    .status {
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .status.accept { background: #e4f3e8; color: var(--green); }
    .status.decline { background: #f7e4e4; color: var(--red); }

    .tag { font-size: 0.82rem; color: var(--muted); margin-left: 6px; }

    button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-right: 6px;
    }

    button:hover { opacity: 0.7; }
  </style>
</head>
<body>

<header>
  <h1>Lista de Presenças</h1>
  <p>Visualize quem aceitou ou recusou.</p>
</header>

<section class="card">
  <div class="summary" id="summary"></div>
  <div id="loading">Carregando...</div>

  <table id="table" style="display:none;">
    <thead>
      <tr>
        <th>Convidado</th>
        <th>Status</th>
        <th>Origem</th>
        <th>Data</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  
const SUPABASE_URL = "https://ryshakfrrjxkjlahtkzc.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_1I4ijX-LaH_YKsR9SmXA4Q_Rl_w0ZiF";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tbody = document.getElementById("tbody");
const summaryBox = document.getElementById("summary");
const table = document.getElementById("table");
const loading = document.getElementById("loading");

let GLOBAL_DATA = [];

const isCrianca = (nome) => {
  if (!nome) return false;
  return nome.toLowerCase().includes("(criança)");
};

const fmtDate = (iso) => {
  if (!iso) return "";
  return new Date(iso).toLocaleString("pt-BR");
};

const buildSummary = (rows) => {
  const guests = rows.flatMap(r => r.convidados || []);
  const total = guests.length;
  const criancas = guests.filter(g => isCrianca(g.nome)).length;
  const reais = total - criancas;
  const aceitosTotal = guests.filter(g => g.status === "aceito").length;
  const aceitosReais = guests.filter(g => g.status === "aceito" && !isCrianca(g.nome)).length;
  const recusados = guests.filter(g => g.status === "recusado").length;

  summaryBox.innerHTML = `
    <span class="pill">Total convidados: ${total}</span>
    <span class="pill">Convidados reais: ${reais}</span>
    <span class="pill">Crianças: ${criancas}</span>
    <span class="pill green">Aceitos (total): ${aceitosTotal}</span>
    <span class="pill green">Aceitos reais: ${aceitosReais}</span>
    <span class="pill red">Recusados: ${recusados}</span>
  `;
};

// Função de salvar atualizada
const salvarNoBanco = async (rowIndex) => {
  const row = GLOBAL_DATA[rowIndex];

  if (!row?.id) {
    alert("Registro sem id. Recarregue a página.");
    return;
  }

  // Se não sobrou ninguém, apaga o registro inteiro
  if (!row.convidados.length) {
    const { data, error } = await supabaseClient
      .from("rsvp")
      .delete()
      .eq("id", row.id)
      .select("id");

    if (error) {
      alert("Erro ao apagar: " + error.message);
      await load();
      return;
    }

    if (!data?.length) {
      alert(
        "Não foi possível apagar: falta permissão de DELETE no Supabase (RLS).\n\n" +
        "Rode no SQL Editor:\n" +
        'create policy "Permitir delete" on rsvp for delete to anon using (true);'
      );
      await load();
      return;
    }

    await load();
    return;
  }

  const { data, error } = await supabaseClient
    .from("rsvp")
    .update({ convidados: row.convidados })
    .eq("id", row.id)
    .select("id");

  if (error) {
    alert("Erro ao salvar: " + error.message);
    await load();
    return;
  }

  if (!data?.length) {
    alert(
      "Não foi possível salvar: falta permissão de UPDATE no Supabase (RLS).\n\n" +
      "Rode no SQL Editor:\n" +
      'create policy "Permitir update" on rsvp for update to anon using (true) with check (true);'
    );
    await load();
    return;
  }

  await load();
};

// Tornando as funções globais para o onclick funcionar
window.editarNome = (rowIndex, guestIndex) => {
  const convidado = GLOBAL_DATA[rowIndex].convidados[guestIndex];
  const novoNome = prompt("Editar nome:", convidado.nome.replace(/\(Criança\)/gi, "").trim());

  if (novoNome === null) return; // Cancelou

  // Mantém a tag de criança se já existia
  const sufixo = isCrianca(convidado.nome) ? " (Criança)" : "";
  convidado.nome = novoNome.trim() + sufixo;

  salvarNoBanco(rowIndex);
};

window.toggleCrianca = (rowIndex, guestIndex) => {
  let nome = GLOBAL_DATA[rowIndex].convidados[guestIndex].nome;

  if (isCrianca(nome)) {
    nome = nome.replace(/\(Criança\)/gi, "").trim();
  } else {
    nome = nome.trim() + " (Criança)";
  }

  GLOBAL_DATA[rowIndex].convidados[guestIndex].nome = nome;
  salvarNoBanco(rowIndex);
};

window.excluirConvidado = async (rowIndex, guestIndex) => {
  if (!confirm("Excluir este convidado?")) return;
  GLOBAL_DATA[rowIndex].convidados.splice(guestIndex, 1);
  await salvarNoBanco(rowIndex);
};

const renderRows = (rows) => {
  tbody.innerHTML = "";
  rows.forEach((row, rowIndex) => {
    (row.convidados || []).forEach((guest, guestIndex) => {
      const tr = document.createElement("tr");
      // Limpa o nome para exibição na célula, já que a tag vem depois
      const nomeLimpo = guest.nome.replace(/\(Criança\)/gi, "").trim();
      const tag = isCrianca(guest.nome) ? '<span class="tag">(Criança)</span>' : '';

      tr.innerHTML = `
        <td>${nomeLimpo} ${tag}</td>
        <td><span class="status ${guest.status === "aceito" ? "accept" : "decline"}">
          ${guest.status === "aceito" ? "Aceito" : "Recusado"}
        </span></td>
        <td>${row.origem || "-"}</td>
        <td>${fmtDate(row.created_at)}</td>
        <td>
          <button onclick="editarNome(${rowIndex}, ${guestIndex})">✏️</button>
          <button onclick="toggleCrianca(${rowIndex}, ${guestIndex})">👶</button>
          <button onclick="excluirConvidado(${rowIndex}, ${guestIndex})">🗑️</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  });
};

const load = async () => {
  const { data, error } = await supabaseClient
    .from("rsvp")
    .select("id,convidados,origem,created_at")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    loading.textContent = `Erro ao carregar: ${error.message}`;
    loading.style.color = "var(--red)";
    return;
  }

  GLOBAL_DATA = data || [];
  loading.style.display = "none";
  table.style.display = "table";

  if (!GLOBAL_DATA.length) {
    loading.style.display = "block";
    loading.style.color = "var(--muted)";
    loading.textContent = "Nenhuma confirmação ainda.";
    table.style.display = "none";
    buildSummary([]);
    return;
  }

  buildSummary(GLOBAL_DATA);
  renderRows(GLOBAL_DATA);
};

load();
</script>

</body>
</html>
